name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "src/**"
      - "package.json"
      - ".github/workflows/android-apk.yml"

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm install

      - name: Validate TypeScript
        run: npm run mobile:typecheck

      - name: Generate Android project
        working-directory: apps/mobile
        env:
          CI: "1"
        run: npx expo prebuild --platform android --clean --non-interactive

      - name: Build debug APK
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk dist/project-evolve-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: project-evolve-android-debug
          path: dist/project-evolve-debug.apk
          if-no-files-found: error
          retention-days: 14
