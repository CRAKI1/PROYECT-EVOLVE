name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "src/**"
      - "package.json"
      - ".github/workflows/android-apk.yml"

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-standalone-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm install

      - name: Validate TypeScript
        run: npm run mobile:typecheck

      - name: Generate Android project
        working-directory: apps/mobile
        env:
          CI: "1"
        run: npx expo prebuild --platform android --clean --non-interactive

      - name: Harden Gradle wrapper download
        run: |
          sed -i 's#services.gradle.org/distributions#downloads.gradle.org/distributions#' apps/mobile/android/gradle/wrapper/gradle-wrapper.properties
          echo 'networkTimeout=120000' >> apps/mobile/android/gradle/wrapper/gradle-wrapper.properties

      - name: Build standalone release APK
        working-directory: apps/mobile/android
        env:
          NODE_ENV: production
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon

      - name: Locate and rename APK
        run: |
          mkdir -p dist
          APK_PATH="$(find apps/mobile/android/app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          test -n "$APK_PATH"
          cp "$APK_PATH" dist/project-evolve-standalone.apk

      - name: Upload standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: project-evolve-android-standalone
          path: dist/project-evolve-standalone.apk
          if-no-files-found: error
          retention-days: 14
